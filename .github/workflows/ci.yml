name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端构建（Vue + Vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: warn

  # Rust / Tauri 侧暂未纳入 CI。
  # 原因：src-tauri 依赖 onnxruntime、图像解码等原生库，需要先固定各平台的
  # 系统依赖与预编译产物，否则 CI 会长期红。补齐步骤见 docs/发布与更新.md「CI 的缺口」。
